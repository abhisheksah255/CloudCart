# nginx.aws.conf — used by the image you push to ECR.
#
# In AWS the Application Load Balancer owns path routing:
#   /api/auth/*  /api/products*  /api/cart*  /api/orders*  /api/payments*  -> backend target groups
#   everything else                                                        -> this container
# so nginx here only serves static files. No upstreams, nothing to resolve at start-up.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Used by the ALB target-group health check
    location = /health { return 200 '{"status":"OK","service":"frontend"}'; add_header Content-Type application/json; }

    # Cache static assets aggressively; HTML not at all
    location ~* \.(js|css|png|jpg|svg|ico)$ { expires 7d; add_header Cache-Control "public"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
