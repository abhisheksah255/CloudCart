# nginx.local.conf — used by docker-compose ONLY.
#
# Locally, nginx plays TWO roles:
#   1. serves the static SPA files
#   2. acts as the single entry point and reverse-proxies /api/* to each microservice
#      (this is exactly the job the AWS Application Load Balancer does in production,
#       so the frontend code never needs to know where the services live)
#
# Hostnames like "auth-service" resolve because docker-compose puts every container on
# the same network and registers each service name in Docker's internal DNS.

upstream auth_service    { server auth-service:5001; }
upstream product_service { server product-service:5002; }
upstream cart_service    { server cart-service:5003; }
upstream order_service   { server order-service:5004; }
upstream payment_service { server payment-service:5005; }

server {
    listen 80;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # --- API routing (mirrors the ALB listener rules) ---
    location /api/auth/     { proxy_pass http://auth_service;    include /etc/nginx/proxy_params.conf; }
    location /api/products  { proxy_pass http://product_service; include /etc/nginx/proxy_params.conf; }
    location /api/cart      { proxy_pass http://cart_service;    include /etc/nginx/proxy_params.conf; }
    location /api/orders    { proxy_pass http://order_service;   include /etc/nginx/proxy_params.conf; }
    location /api/payments  { proxy_pass http://payment_service; include /etc/nginx/proxy_params.conf; }

    # --- health check for the frontend container itself ---
    location = /health { return 200 '{"status":"OK","service":"frontend"}'; add_header Content-Type application/json; }

    # --- SPA: any unknown path falls back to index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
